<?xml version="1.0" encoding="UTF-8"?>
<!--
  Elite Turf — Logo carré 1000×1000 (background TRANSPARENT)
  Usage : Header navbar du site (fond sombre bg-bg-primary), overlays sur photos,
          documents PDF, signatures emails dynamiques.

  Différences vs logo-square-blue.svg :
    - Pas de <rect fill="#1E3A5F"> en background
    - Pas de bandes dorées top/bottom
    - Texte "ELITE TURF" en BLANC (mieux visible sur fond sombre)
-->
<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%"   stop-color="#E8C97A"/>
      <stop offset="35%"  stop-color="#D4B86A"/>
      <stop offset="65%"  stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#A0832A"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetBlur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Pas de background — transparent -->

  <!-- Fer à cheval centré -->
  <g transform="translate(500, 400)" filter="url(#dropShadow)">
    <path d="M -180 -200 L -180 -40 A 180 180 0 0 0 180 -40 L 180 -200"
          stroke="url(#goldGradient)"
          stroke-width="115"
          fill="none"
          stroke-linecap="round"/>
    <!-- Trous de clous : couleur de fond du header (proche du noir/navy) -->
    <circle cx="160"  cy="20"   r="13" fill="#0D0D14"/>
    <circle cx="148"  cy="-65"  r="13" fill="#0D0D14"/>
    <circle cx="130"  cy="-150" r="13" fill="#0D0D14"/>
    <circle cx="-160" cy="20"   r="13" fill="#0D0D14"/>
    <circle cx="-148" cy="-65"  r="13" fill="#0D0D14"/>
    <circle cx="-130" cy="-150" r="13" fill="#0D0D14"/>
  </g>

  <!-- ELITE TURF en BLANC (visible sur tout fond sombre) -->
  <text x="500" y="790"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="118"
        font-weight="bold"
        fill="#FFFFFF"
        letter-spacing="14">ELITE TURF</text>

  <!-- Sous-titre en or brossé -->
  <text x="500" y="870"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="34"
        font-style="italic"
        fill="#C9A84C"
        opacity="0.85"
        letter-spacing="6">Pronostics PMU</text>

  <!-- Ligne dorée décorative sous le sous-titre -->
  <line x1="420" y1="900" x2="580" y2="900"
        stroke="#C9A84C" stroke-width="2" opacity="0.6"/>
</svg>
