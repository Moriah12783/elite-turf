<?xml version="1.0" encoding="UTF-8"?>
<!--
  Elite Turf — Logo horizontal 1000×200 (background bleu nuit)
  Usage : Knowledge Graph Google, header email, signature, OpenGraph image (variante).

  Layout : Fer à cheval à gauche (compact) + "ELITE TURF" wordmark à droite
           + tagline "Pronostics PMU francophones" en italique sous le texte.
-->
<svg viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%"   stop-color="#E8C97A"/>
      <stop offset="35%"  stop-color="#D4B86A"/>
      <stop offset="65%"  stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#A0832A"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetBlur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background bleu nuit -->
  <rect width="1000" height="200" fill="#1E3A5F"/>

  <!-- Lignes décoratives dorées en haut et bas -->
  <rect x="0" y="0"   width="1000" height="2" fill="#C9A84C" opacity="0.5"/>
  <rect x="0" y="198" width="1000" height="2" fill="#C9A84C" opacity="0.5"/>

  <!-- Fer à cheval à gauche (centré vertical à y=100) -->
  <g transform="translate(120, 105)" filter="url(#dropShadow)">
    <path d="M -55 -65 L -55 -15 A 55 55 0 0 0 55 -15 L 55 -65"
          stroke="url(#goldGradient)"
          stroke-width="34"
          fill="none"
          stroke-linecap="round"/>
    <!-- 4 trous de clous (réduits pour échelle compacte) -->
    <circle cx="48"  cy="0"   r="4" fill="#1E3A5F"/>
    <circle cx="42"  cy="-35" r="4" fill="#1E3A5F"/>
    <circle cx="-48" cy="0"   r="4" fill="#1E3A5F"/>
    <circle cx="-42" cy="-35" r="4" fill="#1E3A5F"/>
  </g>

  <!-- Séparateur vertical doré (touche premium) -->
  <line x1="225" y1="50" x2="225" y2="150"
        stroke="#C9A84C" stroke-width="1" opacity="0.4"/>

  <!-- ELITE TURF wordmark -->
  <text x="255" y="105"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="62"
        font-weight="bold"
        fill="url(#goldGradient)"
        letter-spacing="6">ELITE TURF</text>

  <!-- Tagline en italique sous le texte -->
  <text x="257" y="148"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="21"
        font-style="italic"
        fill="#C9A84C"
        opacity="0.75"
        letter-spacing="2.5">Pronostics PMU francophones</text>
</svg>
