<?xml version="1.0" encoding="UTF-8"?>
<!--
  Elite Turf — Logo carré 1000×1000 (background bleu nuit)
  Usage : JSON-LD Organization, Publisher Center Google News, social cards.

  Design : Fer à cheval orienté U (ouverture vers le haut = retient la chance).
  Palette : Or brossé #C9A84C → #D4B86A (gradient métallique) sur fond #1E3A5F.
  Typo : Georgia bold + tracking large (cohérent avec emails Elite Turf).
-->
<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient or brossé métallique -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%"   stop-color="#E8C97A"/>
      <stop offset="35%"  stop-color="#D4B86A"/>
      <stop offset="65%"  stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#A0832A"/>
    </linearGradient>
    <!-- Filtre ombre légère pour profondeur -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetBlur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background bleu nuit (coins arrondis pour version icône) -->
  <rect width="1000" height="1000" fill="#1E3A5F"/>

  <!-- Bande dorée subtile en haut + bas (signature design) -->
  <rect x="0" y="0" width="1000" height="3" fill="#C9A84C" opacity="0.5"/>
  <rect x="0" y="997" width="1000" height="3" fill="#C9A84C" opacity="0.5"/>

  <!-- Fer à cheval centré (ouverture vers le HAUT = U inversé en SVG Y-down)
       Centre du fer à (500, 400). Arc dans la partie basse, talons en haut.
       Stroke épais pour l'épaisseur du fer + linecap=round pour talons élégants. -->
  <g transform="translate(500, 400)" filter="url(#dropShadow)">
    <!-- Le fer : 2 talons verticaux + 1 arc en bas (semi-circle qui ouvre en haut) -->
    <path d="M -180 -200 L -180 -40 A 180 180 0 0 0 180 -40 L 180 -200"
          stroke="url(#goldGradient)"
          stroke-width="115"
          fill="none"
          stroke-linecap="round"/>

    <!-- 6 trous de clous (signe "fer travaillé", premium) -->
    <!-- Côté droit (3 trous) -->
    <circle cx="160"  cy="20"   r="13" fill="#1E3A5F"/>
    <circle cx="148"  cy="-65"  r="13" fill="#1E3A5F"/>
    <circle cx="130"  cy="-150" r="13" fill="#1E3A5F"/>
    <!-- Côté gauche (3 trous, miroir) -->
    <circle cx="-160" cy="20"   r="13" fill="#1E3A5F"/>
    <circle cx="-148" cy="-65"  r="13" fill="#1E3A5F"/>
    <circle cx="-130" cy="-150" r="13" fill="#1E3A5F"/>
  </g>

  <!-- ELITE TURF (serif, lettre-espacement large, or brossé) -->
  <text x="500" y="790"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="118"
        font-weight="bold"
        fill="url(#goldGradient)"
        letter-spacing="14">ELITE TURF</text>

  <!-- Sous-titre raffiné -->
  <text x="500" y="870"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="34"
        font-style="italic"
        fill="#C9A84C"
        opacity="0.75"
        letter-spacing="6">Pronostics PMU</text>

  <!-- Ligne dorée décorative sous le sous-titre -->
  <line x1="420" y1="900" x2="580" y2="900"
        stroke="#C9A84C" stroke-width="2" opacity="0.5"/>
</svg>
