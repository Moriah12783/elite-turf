name: pmu-sync

# Sync du PROGRAMME DU JOUR Geny → Supabase, sur runner GitHub (IP Azure →
# HTTP 200) car Geny renvoie 403 à l'IP du Worker Cloudflare.
# Déclenché À L'HEURE par le cron Cloudflare (10h05 UTC, AVANT le pipeline IA
# de 06h15/06h45) via workflow_dispatch ; le schedule est un filet.

on:
  schedule:
    - cron: "20 5 * * *"   # filet de sécurité (le dispatch on-time est à 10 5)
  workflow_dispatch:

concurrency:
  group: pmu-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Bundle CLI (esbuild résout les alias @/)
        run: >-
          npx -y esbuild scripts/geny-programme-cli.ts
          --bundle --platform=node --format=esm --target=node20
          --tsconfig=tsconfig.json --packages=external
          --outfile=geny-programme.mjs

      - name: Sync programme du jour
        run: node geny-programme.mjs
        env:
          PROG_DAY: today
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
