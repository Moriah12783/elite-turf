name: backfill-rapports

# Remplissage ponctuel des rapports PMU définitifs dans arrivees.rapports_pmu,
# depuis l'API PMU officielle (lib/sync/pmu-rapports.ts). Manuel uniquement.
# Depuis le 02/10/2026 : la source Geny (403) est remplacée par le PMU.
#
# N'écrase jamais un rapport existant, ne touche jamais ordre_arrivee, et
# n'alimente pas le ROI (propagation coupée, lib/pmu-backfill-rapport-gagnant.ts).

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Portée : quinte (Quinté+, défaut) ou all (toutes les courses françaises terminées)"
        type: choice
        required: true
        default: quinte
        options:
          - quinte
          - all
      since:
        description: "Borne basse date_course (YYYY-MM-DD, défaut : 30 jours en arrière)"
        type: string
        required: false
        default: ""
      limit:
        description: "Plafond du nombre de courses (optionnel, ex: 50 pour un test)"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Dry-run (ne rien écrire, rapport seulement)"
        type: boolean
        required: false
        default: false

concurrency:
  group: backfill-rapports
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # 'all' peut re-fetch plusieurs centaines de pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Bundle CLI (esbuild résout les alias @/)
        run: >-
          npx -y esbuild scripts/pmu-rapports-backfill-cli.ts
          --bundle --platform=node --format=esm --target=node20
          --tsconfig=tsconfig.json --packages=external
          --outfile=pmu-rapports-backfill.mjs

      - name: Backfill rapports PMU
        run: node pmu-rapports-backfill.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKFILL_SCOPE: ${{ inputs.scope }}
          BACKFILL_SINCE: ${{ inputs.since }}
          BACKFILL_LIMIT: ${{ inputs.limit }}
          BACKFILL_DRY_RUN: ${{ inputs.dry_run }}
