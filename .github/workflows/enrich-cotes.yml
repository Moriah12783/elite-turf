name: enrich-cotes

# Remplit les COTES + partants depuis Geny, exécuté sur les runners GitHub
# (IP Azure → HTTP 200) car Geny renvoie 403 à l'IP du Worker Cloudflare.
# Gratuit + autonome. En cas d'échec total, le job sort en erreur → GitHub
# envoie un email au propriétaire du repo (alerte anti-silent-failure).
#
# Mêmes horaires que l'ancien cron Cloudflare enrichir-partants (UTC).

on:
  schedule:
    - cron: "30 5 * * *"
    - cron: "47 11 * * *"
    - cron: "13 13 * * *"
    - cron: "13 15 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date YYYY-MM-DD (défaut : aujourd'hui)"
        required: false
  # Déclencheur de test sur la branche de dev (retiré avant merge).
  push:
    branches: [fix/cotes-via-github-actions]

concurrency:
  group: enrich-cotes
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Bundle CLI (esbuild résout les alias @/)
        run: >-
          npx -y esbuild scripts/geny-enrich-cli.ts
          --bundle --platform=node --format=esm --target=node20
          --tsconfig=tsconfig.json --packages=external
          --outfile=geny-enrich.mjs

      - name: Enrichir les cotes
        run: node geny-enrich.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_DATE: ${{ github.event.inputs.date }}
