# ────────────────────────────────────────────────────────────────────────
# Worker Cloudflare dédié aux Cron Triggers — ELITE TURF
# ────────────────────────────────────────────────────────────────────────
#
# Pourquoi un worker séparé ?
#   - L'app principale (`elite-turf`) est générée par OpenNext qui ne supporte
#     pas nativement le `scheduled()` handler (entry point géré).
#   - Modifier `.open-next/worker.js` est fragile (regénéré à chaque build).
#   - Solution propre : un mini-Worker dédié qui fait juste des HTTP fetch
#     vers les endpoints `/api/cron/*` de l'app principale, déclenchés par
#     les Cron Triggers Cloudflare natifs.
#
# Déploiement (une seule fois) :
#   1. Set le secret CRON_SECRET (mêmes valeur que l'app principale) :
#      $ npx wrangler secret put CRON_SECRET --config cron-worker/wrangler.toml
#   2. Deploy le worker :
#      $ npx wrangler deploy --config cron-worker/wrangler.toml
#   3. Vérifier dans Cloudflare dashboard → elite-turf-crons → Triggers
#      que les 36 crons sont bien actifs.
#
# Mise à jour des schedules :
#   - Modifier la liste `[triggers].crons` ci-dessous
#   - Modifier le mapping `CRON_MAP` dans src/index.ts
#   - Re-deploy : `npx wrangler deploy --config cron-worker/wrangler.toml`
#
# Coût : Cloudflare Workers Paid plan (5 USD/mois) déjà actif. Les Cron
# Triggers sont gratuits jusqu'à 100/worker. On en a 36, OK.

# Last redeploy : 2026-05-16 (GitHub Action auto-deploy activée — PR fix/auto-deploy-cron-worker)
# Cette ligne sert à forcer le premier trigger de la workflow GitHub Action
# "Deploy Cron Worker" après merge (paths: cron-worker/**).
name = "elite-turf-crons"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ────────────────────────────────────────────────────────────────────────
# Variables non-secrètes (URL de l'app à déclencher)
# ────────────────────────────────────────────────────────────────────────
[vars]
APP_URL = "https://www.elite-turf.fr"

# CRON_SECRET est passé via :
#   $ wrangler secret put CRON_SECRET --config cron-worker/wrangler.toml
# (ne PAS commiter ici)

# ────────────────────────────────────────────────────────────────────────
# Cron Triggers — copie 1:1 des schedules de l'ancien vercel.json
# ────────────────────────────────────────────────────────────────────────
[triggers]
crons = [
  # ── IA Pronostics & contenus ────────────────────────────────────────
  #
  # Système Multi-Agents (cahier §13-17) — depuis 2026-05-14
  #   1. enrichir-partants (premier passage) peuple les partants détaillés
  #      en BDD (musique, jockey, cote) à partir de Geny+PMU.fr.
  #   2. source-evidence-collector génère les preuves LONACI + PMU.fr
  #      (table course_source_evidence) pour valider la disponibilité
  #      Afrique de chaque course.
  #   3. ia-pronostics-v2 sélectionne les courses validées, fait tourner
  #      le pipeline 6 agents (Director + 5 Workers), et stocke les
  #      drafts dans ai_pronostic_drafts pour review humaine sur
  #      /admin/pronostics/ai-review (PAS de publication auto).
  #
  # Historique du décalage (2026-05-15, post-incident "1 seul draft/jour") :
  # Avant on tournait à "30 2 * * *" (collector) + "0 3 * * *" (pipeline),
  # soit ~05:00 Paris. PROBLÈME : les partants n'étaient scrapés qu'à partir
  # de 09:27 UTC (enrichir-partants premier passage) → le pipeline tournait
  # AVANT que les partants existent en BDD → FieldAnalyzer voyait des fields
  # vides → SelectionBuilder retournait selected_runners=[] → director.ts
  # faisait `continue` silencieusement → 0-2 drafts/jour au lieu de 5-6.
  #
  # Nouveau planning : enrichir-partants matinal à 05:30 UTC pour que les
  # partants soient en BDD AVANT le pipeline.
  #
  # NB Cloudflare cron = UTC fixe, pas de DST automatique :
  #   - "30 5 * * *" = 6h30 Paris hiver / 7h30 Paris été
  #   - "15 6 * * *" = 7h15 Paris hiver / 8h15 Paris été
  #   - "45 6 * * *" = 7h45 Paris hiver / 8h45 Paris été
  # Glissement +1h en été accepté (cron Cloudflare ne supporte pas
  # Europe/Paris timezone). Pour le marché Afrique francophone (UTC+0),
  # 06:45 UTC = 06:45 Abidjan = matinal idéal pour les abonnés CI.
  "15 6 * * *",      # source-evidence-collector (preuves LONACI+PMU avant pipeline)
  "45 6 * * *",      # ia-pronostics-v2 (pipeline Multi-Agents → drafts review humaine)
  "30 8 * * *",      # morning-safety-net (filet : si le pipeline 06:45 a vu 0 course, recharge programme+preuves+pipeline ~1h45 après)
  "0 19 * * *",      # ia-rapport-soir
  "45 9 * * *",      # pronostic-gratuit (publication 9h45)
  "30 9 * * *",      # ia-auto-publish-v2 (filet sécurité premium : publie les brouillons du jour SI l'admin est absent)

  # ── Sync programme + partants ───────────────────────────────────────
  "41 7 * * *",      # lonaci-sync (matin)
  "37 11 * * *",     # lonaci-sync (rappel midi)
  "30 5 * * *",      # enrichir-partants (5h30 UTC - AVANT pipeline Multi-Agents)
  "47 11 * * *",     # enrichir-partants (11h47)
  "13 13 * * *",     # enrichir-partants (13h13)
  "13 15 * * *",     # enrichir-partants (15h13)
  "0 20 * * *",      # pmu-demain (programme J+1, re-planifié hors fenêtre 522 du 17h43) — fix Cause A
  "10 5 * * *",      # pmu-sync (programme du JOUR, AVANT enrichir/collecteur/pipeline) — fix Cause A

  # ── Sync arrivées (toutes les heures 13h-19h UTC) ───────────────────
  "11 13 * * *",     # geny-arrivees
  "11 14 * * *",
  "11 15 * * *",
  "11 16 * * *",
  "11 17 * * *",
  "11 18 * * *",
  "11 19 * * *",

  # ── Sync résultats (post-courses) ───────────────────────────────────
  "23 6 * * *",      # admin/sync-resultats matinal
  "17 19 * * *",     # admin/sync-resultats soir 1
  "17 20 * * *",     # admin/sync-resultats soir 2
  "17 21 * * *",     # admin/sync-resultats soir 3
  "17 22 * * *",     # admin/sync-resultats soir 4
  "37 20 * * *",     # admin/rapport-journalier (recap soir)

  # ── Propagation dividendes (rapport_gagnant) ────────────────────────
  # Propage arrivees.rapports_pmu → pronostics.rapport_gagnant après le
  # dernier sync-resultats du soir. Sinon ROI/gains affichés faux (PR #151).
  "40 22 * * *",     # backfill-rapport-gagnant (dividendes → pronostics, fenêtre 90j self-healing)

  # ── Abonnements & paiements ─────────────────────────────────────────
  "7 1 * * *",       # expire-abonnements (1h07 nuit)
  "13 9 * * *",      # rappel-expiration (matin)
  "*/15 * * * *",    # paystack-recovery (toutes les 15 min)

  # ── Monitoring & SEO ────────────────────────────────────────────────
  "*/30 * * * *",    # health-alerter (toutes les 30 min)
  "45 3 * * *",      # seo-etl (sitemap + canonicals 3h45 nuit)

  # ── Notifications utilisateurs ──────────────────────────────────────
  "23 * * * *",      # welcome-emails (toutes les heures à :23)
  "0 6 * * *",       # daily-push matin
  "0 17 * * *",      # daily-push soir
]

# ────────────────────────────────────────────────────────────────────────
# Observabilité
# ────────────────────────────────────────────────────────────────────────
[observability]
enabled = true
head_sampling_rate = 1.0  # log 100% des invocations cron (faible volume)

# Note : la section [limits].cpu_ms a été retirée car elle requiert un
# plan Cloudflare Workers Standard (au-dessus de Paid de base). Les
# defaults Workers Paid (Bundled) sont largement suffisants pour des
# crons qui font juste un HTTP fetch (1-2s).
# Si nécessaire un jour, upgrader le plan puis ré-ajouter [limits].
